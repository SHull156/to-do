<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    

</head>

<main>
    <body>
        <section id="hero">
            <h1>To do list</h1>
            <h2>The to do list for busy EAs</h2>
            <p>Use this to do list to track task so you never miss an email again</p>
        </section>

        <section id="task-creator">
            <label for="">Create a task</label>
            <input id="input-text" type="text">
            <button id="add-task-button">Add task</button>

        </section>

        <section id="todos">

            <div class="card" id="outstanding">
                <div class ="container">
                    <h2>Outstanding</h2>
                    <ul id="outstanding-task-list">

                    </ul>
                </div>
            </div>

            <div class="card" id="in-process">
                <div class ="container">
                    <h2>In process</h2>
                    <ul id="in-process-task-list">

                    </ul>
                </div>
            </div>

            <div class="card" id= "complete">
                <div class ="container">
                    <h2>Completed</h2>
                    <ul id="completed-task-list">

                    </ul>
                </div>
            </div>


            </section>

        
    <script src="script.js"></script>
        
    </body>
</main>

</html>
