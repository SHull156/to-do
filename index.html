<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="hero">
        <h1>To do list</h1>
        <h2>The to do list for busy EAs</h2>
        <p>Use this to do list to track task so you never miss an email again</p>
    </section>

    <section id="task-creator">
        <label for="">Create a task</label>
        <input id="input-text" type="text">

    </section>

    <section id="todos">
        <div id="outstanding">
            <h2>Outstanding tasks</h2>
        </div>

        <div id="in-process">
            <h2>In process tasks</h2>
        </div>

        <div id="complete">
            <h2>Completed tasks</h2>
        </div>


        </section>

    
    
    
</body>
</html>
